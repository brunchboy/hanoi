<div class="navigation">
  <hr>
  <table>
    <tbody>
      <tr>
        <td class="previous">
          <button id="previous-button" type="button">←</button>
          <label id="previous-title" for="nav-previous"></label>
        </td>

        <td class="menu">
          <label for="page-menu">Page:</label>
          <select name"page" id="page-select">
          </select>
        </td>

        <td class="next">
          <label id="next-title" for="nav-next"></label>
          <button id="next-button" type="button">→</button>
        </td>
      </tr>
      <tr id="step-row" class="hidden">
        <td></td>
        <td>
          Step: <span id="step-number">1</span><span id="step-count"> of 1</span>&nbsp;
          <button id="step-button" type="button" onClick="nextStep();">Next</button>
        </td>
        <td></td>
      </tr>
    </tbody>
  </table>
</div>
