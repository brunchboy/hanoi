<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Towers of Hanoi</title>

    <link rel="stylesheet" href="css/main.css"/>
    <script src="js/scittle.js" type="application/javascript"></script>
    <script>var SCITTLE_NREPL_WEBSOCKET_PORT = 1340;</script>
    <script src="js/scittle.nrepl.js" type="application/javascript"></script>
    <script src="cljs/nav.cljs" type="application/x-scittle"></script>
    <script src="cljs/board.cljs" type="application/x-scittle"></script>
    <script src="cljs/recursive_demo.cljs" type="application/x-scittle"></script>
  </head>

  <body>
    <div class="slide">
      <table>
        <thead>
          <tr>
            <th>State</th>
            <th>Tasks</th>
            <th>Moves</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <canvas id="state" width="600" height="400"></canvas>
            </td>
            <td>
              <div class="scrollableAreaContainer">
                <div class="scrollableTaskContainer">
                  <ul id="tasks" class="scrollableTasks">
                  </ul>
                </div>
              </div>
            </td>
            <td>
              <div class="scrollableAreaContainer">
                <div class="scrollableMoveContainer">
                  <ul id="moves" class="scrollableMoves">
                  </ul>
                </div>
              </div>
            </td>
          </tr>
          <tr class="controls">
            <td>
              <label for="num-rings">Number of rings:</label>
              <input id="num-rings" type="number" min="1" max="10" value="10" />
              <button type="button" onclick="resetBoard()">Reset Board</button>
            </td>
            <td colspan="2">
              <label for="fade-ms">Speed:</label>
              🐇 <input type="range" id="fade-ms" min="50" max="1500" value="500" step="10"/> 🐢
              &nbsp;
              <label for="auto-step">Auto-step:</label>
              <input type="checkbox" id="auto-step" switch />
            </td>
            </tr>
        </tbody>
      </table>

      <p class="running">Running: <span id="running"><em>nothing, ready to start</em></span></p>

      <div id="code"></div>
    </div>

    <div id="navigation"></div>

  </body>
</html>
