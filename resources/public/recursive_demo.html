<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towers of Hanoi</title>

    <script src="js/scittle.js" type="application/javascript"></script>
    <script>var SCITTLE_NREPL_WEBSOCKET_PORT = 1340;</script>
    <script src="js/scittle.nrepl.js" type="application/javascript"></script>
    <script src="cljs/nav.cljs" type="application/x-scittle"></script>
    <script src="cljs/board.cljs" type="application/x-scittle"></script>

    <style>
      .scrollableAreaContainer {
          width: 200px;
          height: 400px;

          border: 2px solid #111;
          overflow: auto;
      }
      .scrollableTaskContainer {
          padding: 0;
      }
      .scrollableTasks li {
          padding: 10px;
          font-family: sans-serif;
          font-size: 20px;
          list-style-type: circle;
          transition: opacity 500ms, display 500ms allow-discrete;
      }
      .scrollableTasks li.running {
          list-style-type: disc;
          color: green;
      }
      .scrollableTasks li.hidden {
          opacity: 0;
      }
      .scrollableMoveContainer {
          padding: 0;
      }
      .scrollableMoves li {
          padding: 5px;
          font-family: sans-serif;
          font-size: 20px;

      }

    </style>
  </head>

  <body>
    <table>
      <thead>
        <tr>
          <th>State</th>
          <th>Tasks</th>
          <th>Moves</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <canvas id="state" width="600" height="400"></canvas>
          </td>
          <td>
            <div class="scrollableAreaContainer">
              <div class="scrollableTaskContainer">
                <ul id="tasks" class="scrollableTasks">
                </ul>
              </div>
            </div>
          </td>
          <td>
            <div class="scrollableAreaContainer">
              <div class="scrollableMoveContainer">
                <ul id="moves" class="scrollableMoves">
                </ul>
              </div>
            </div>

          </td>
        </tr>
      </tbody>
    </table>

    <p>
      <label for="numDiscs">Number of discs:</label>
      <input id="numDiscs" type="number" min="1" max="10" value="10" />
      <button onclick="resetBoard()">Reset Board</button>
    </p>

    <p>
      <button onclick="showNotes()">Show Notes</button>
      &nbsp;&nbsp;
      <button id="stepButton" onclick="runStep()">Step</button>
    </p>
  </body>
</html>
